# Local development — docker compose up --build
# For swarm deployments use: docker stack deploy -c stack.testing.yml deribit-agent
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deribit_agent
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  nestjs:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - nestjs_modules:/app/node_modules
    command: >
      sh -c "yarn install &&
             yarn db:generate &&
             yarn db:migrate:deploy &&
             yarn dev"
    ports:
      - '3031:3031'
    env_file: .env
    environment:
      PORT: 3031
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/deribit_agent
      REDIS_HOST: redis
      REDIS_PASSWORD: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  trainer:
    build:
      context: ./trainer
      dockerfile: Dockerfile
    volumes:
      - trainer_models:/app/models
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/deribit_agent
      MODELS_DIR: /app/models
      POLL_INTERVAL: '30'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  trainer_models:
  nestjs_modules:
