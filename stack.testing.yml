services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: deribit_agent
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - backend
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
                delay: 5s

    redis:
        image: redis:7-alpine
        command: redis-server --requirepass ${REDIS_PASSWORD:-redis}
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis}', 'ping']
            interval: 10s
            timeout: 3s
            retries: 5
        networks:
            - backend
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
                delay: 5s

    # ---------------------------------------------------------------------------
    # ML trainer — DB polling loop (no HTTP server)
    # To enable GPU add a resources.reservations.devices block to deploy.
    # ---------------------------------------------------------------------------
    trainer:
        build:
            context: ./trainer
            dockerfile: Dockerfile
        image: deribit-trainer
        environment:
            DATABASE_URL: postgresql://postgres:postgres@postgres:5432/deribit_agent
            MODELS_DIR: /app/models
            POLL_INTERVAL: '30'
        volumes:
            - trainer_models:/app/models
        networks:
            - backend
        depends_on:
            - postgres
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
                delay: 5s

    nestjs:
        image: node:22
        working_dir: /app
        volumes:
            - .:/app
            - nestjs_node_modules:/app/node_modules
        command: sh -c "yarn install && yarn run dev"
        ports:
            - '3031:3031'
        env_file:
            - .env
        depends_on:
            - postgres
            - redis
        networks:
            - backend
        deploy:
            replicas: 1
            restart_policy:
                condition: on-failure
                delay: 5s

volumes:
    postgres_data:
    redis_data:
    trainer_models:
    nestjs_node_modules:

networks:
    backend:
        driver: overlay
        attachable: true
